<!doctype html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="Cache-Control" content="no-siteapp" />
	<meta http-equiv="Cache-Control" content="no-transform" />
	<title>{$TDK.title}</title>
	<meta name="keywords" content="{$TDK.keyword}" />
	<meta name="description" content="{$TDK.description}" />
	<link rel="canonical" href="{$TDK.canonicalurl}"/>
	<meta name="applicable-device" content="pc">
	<meta http-equiv="mobile-agent" content="format=html5; url={$TDK.canonicalurl_m}">
	<link rel="stylesheet" href="__PUBLIC__/{$theme}/css/style.css?v{$version}" />
	<script src="//cdn.bootcss.com/jquery/2.1.4/jquery.min.js"></script>
	<script type="text/javascript" src="__PUBLIC__/{$theme}/js/header.js?v{$version}"></script>
	<link rel="stylesheet" href="//at.alicdn.com/t/font_626180_rzkibgk7ogl.css">
	<script>var znsid = '{$comset.znsid}';</script>
</head>
<body>
<div id="wrapper">
	<include file="Public/header" />
		<div class="pais91">
			   <div class="pais92">
				  <h2>
				  {$TDK.webname}周榜
				  </h2>
				  <ul>
					<assign name="k" value="0" />
					<foreach name="dataarea_list.pc_top_week" item="v">
					<assign name="k" value="$k+1" />
					<li>
						<span class="num{$k} numer">{$k}</span>
						<span class="s2"><a class="chaptea"  href="{$v['rewriteurl']}" title="最新收录小说《{$v['title']}》">{$v['title']}</a></span>
						<span class="pais93">{$v.author}</span>
						<span class="s5"><a class="numce"><if condition="$articledb['full'] eq 0">连载<else />完本</if></a></span>
						<span class="numce">{$v.weekviews}热度</span>
						
					</li>
					</foreach>
				 </ul>
			</div>
			
			<div class="pais92">
				  <h2>
				  {$TDK.webname}月榜
				  </h2>
				  <ul>
					<assign name="k" value="0" />
					<foreach name="dataarea_list.pc_top_month" item="v">
					<assign name="k" value="$k+1" />
					<li>
						<span class="num{$k} numer">{$k}</span>
						<span class="s2"><a class="chaptea"  href="{$v['rewriteurl']}" title="最新收录小说《{$v['title']}》">{$v['title']}</a></span>
						<span class="pais93">{$v.author}</span>
						<span class="s5"><a class="numce"><if condition="$articledb['full'] eq 0">连载<else />完本</if></a></span>
						<span class="numce">{$v.monthviews}热度</span>
					</li>
					</foreach>
				 </ul>
			</div>

			<div class="pais92">
				  <h2>
				  {$TDK.webname}总榜
				  </h2>
				  <ul>
					<assign name="k" value="0" />
					<foreach name="dataarea_list.pc_top_all" item="v">
					<assign name="k" value="$k+1" />
					<li>
						<span class="num{$k} numer">{$k}</span>
						<span class="s2"><a class="chaptea"  href="{$v['rewriteurl']}" title="最新收录小说《{$v['title']}》">{$v['title']}</a></span>
						<span class="pais93">{$v.author}</span>
						<span class="s5"><a class="numce"><if condition="$articledb['full'] eq 0">连载<else />完本</if></a></span>
						<span class="numce">{$v.views}热度</span>
					</li>
					</foreach>
				 </ul>
			</div>

		</div>
	<include file="Public/footer" />
</div>
</body>
</html>
